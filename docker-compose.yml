version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: retailrocket-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: retailrocket-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/retailrocket
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongo-data:

