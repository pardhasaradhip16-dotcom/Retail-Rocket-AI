services:
  - type: web
    name: retailrocket-mern
    env: node
    plan: free
    buildCommand: npm run install:all && npm run seed && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false

